<!DOCTYPE html>
<html>
    <head>
        <title>Navigation with toggle</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
        <style>
            body {
                margin: 0;
                padding: 0;
                background-color: rgba(65, 50, 33, 0.507);
            }
            nav {
                display: flex;
                justify-content: space-between;
                background-color: rgba(4, 4, 71, 0.733);
                display: flex;
                align-items: center;
            }
            #nav {
                overflow: hidden;
                background-color: white;
                padding: 0px;
            }
            #nav-list {
                display: none;
                
            }
            #nav-list.active {
                display: block;
                color: black;
                font-size: 20px;
                gap: 20px;
            }
            li {
                list-style-type: none;
                margin: 30px;
                text-align: center;
                color: black;
            }
            #login {
                background-color: rgb(63, 18, 224);
                padding: 10px;
                border-radius: 5px;
            }
            #login a {
                color: white;
            }
            #login:hover {
                background-color: rgb(65, 50, 33);
            }
            a {
                text-decoration: none;
                color: black;
                align-self: auto;
            }
            a:hover {
                color: white;
                background-color: rgb(65, 50, 33);
                border-radius: 5px;
                padding: 10px;
            }
            div { 
                text-align: left;
            }
            #toggle-button {
                font-size: 30px;
                background-color: rgba(0, 0, 0, 0.411);
                color: white;
                border: none;
                cursor: pointer;
                margin-left:auto;
                margin-right: 20px;
                padding: 8px 15px;
                border-radius: 5px;
            }
            #toggle-button:hover {
                background-color: rgb(65, 50, 33);
                color: white;
            }
            .logo {
                color: white;
                margin-left: 20px;
            }
            .greeting {
                color: 071B33;
                font-size: 100px;
                margin-left: 40px;
            }
            .vex {
                color: 071B33;
                font-size: 50px;
                margin-left: 70px;
                margin-top: -60px;
                margin-bottom: auto;
            }
            #bami-apps-link {
                display: inline-block;
                margin-left: 70px;
                margin-top: 20px;
                padding: 10px 20px;
                background-color: rgb(63, 18, 224);
                color: white;
                text-decoration: none;
                border-radius: 5px;
            }
        </style>
    </head>
    <body>
        <nav>
                <h1 class="logo">Just Practicing</h1>
            <button id="toggle-button">☰</button>
        </nav>
        <div id="nav">
            <ul id="nav-list">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
                <li id="login"><a href="#">Login</a></li>
            </ul>
        </div>
        <div>
           <p class="greeting"><b>Welcome Boss!</b></p>
           <p class="vex">No vex say e dey come late 😂</p>
        </div>
        <a id="bami-apps-link" href="https://bamiweb.vercel.app" target="_blank">Visit BAMI Apps &emsp;  ➜ </a>
    </body>
    <script>
        const toggleButton = document.getElementById('toggle-button');
        const navList = document.getElementById('nav-list');

        toggleButton.addEventListener('click', () => {
            navList.classList.toggle('active');
            toggleButton.textContent = toggleButton.textContent === '☰' ? '✖' : '☰';
        });
    </script>
</html>
